<div class="login-page">
    <div class="login-card">
        <img
            src="assets/logo.png"
            class="logo"
            alt="Extensiones Dorani">
        <h2>Crear cuenta</h2>
        <p class="text-muted mb-4">
            Inicia sesión para continuar.
        </p>
        <form [formGroup]="form" (ngSubmit)="registrar()">
            <div class="mb-3">
                <label>Email</label>
                <input
                    type="email"
                    class="form-control"
                    formControlName="email">
            </div>
            <div class="mb-4">
                <label>Contraseña</label>
                <input
                    type="password"
                    class="form-control"
                    formControlName="password">
            </div>
            <button class="btn btn-login w-100">
                Registrarme
            </button>
        </form>
        <hr>
        <p class="text-center">
            ¿Ya tienes cuenta?
            Inicia sesión
            <a routerLink="/register">
                Regístrate
            </a>
        </p>
    </div>
</div>
